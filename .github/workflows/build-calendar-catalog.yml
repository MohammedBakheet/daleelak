
name: Build calendar catalog

on:
  push:
    paths:
      - "calendars/**/info.json"
      - "calendars/**/metadata.json"
      - "scripts/build-catalog.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-catalog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate catalog
        run: node scripts/build-catalog.js
      - name: Commit generated catalog
        run: |
          if git diff --quiet -- data/catalog.json; then
            echo "Catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          git commit -m "chore: update calendar catalog"
          git push
